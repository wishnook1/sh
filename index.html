<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shahad Ghazwani</title>
<meta name="description" content="A quiet tree, drawn in graphite. Touch a branch.">
<meta name="theme-color" content="#090909">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23090909'/%3E%3Cpath d='M16 28V14M16 20l-6-6M16 17l6-7' stroke='%23a8a8a8' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">

<style>
/* ==========================================================================
   COMPOSITION: a full-screen pencil tree, trunk to the bottom centre, name
   beneath it, small lowercase labels around the branches. A quiet panel
   opens when a branch is touched.
   COLOURS: near-black, charcoal, graphite, silver, off-white. Nothing else.
   ========================================================================== */
:root{
  --bg:#090909;
  --charcoal:#141414;
  --graphite:#3a3a3a;
  --grey:#77777a;
  --silver:#b4b4b6;
  --paper:#e8e6e2;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --arabic:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(ellipse 65% 70% at 50% 45%,#121212 0%,var(--bg) 70%) var(--bg);
  background-attachment:fixed;
  color:var(--paper);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
}
#garden{position:fixed;inset:0;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.55}

@keyframes appear{from{opacity:0}to{opacity:1}}

/* ---------- the drawing: one canvas per part of the tree ---------- */
.lay{position:absolute;transition:opacity 1s ease,filter 1s ease}
.lay canvas{display:block;width:100%;height:100%;animation:appear 2.8s ease backwards;animation-delay:var(--d,0s)}
body.focus .lay:not(.on){opacity:.12}
body.focus .lay.trunk{opacity:.5}
.lay.on{filter:brightness(1.6) contrast(1.08);animation:touch 1.6s ease}
@keyframes touch{from{filter:brightness(2.7) contrast(1.1)}to{filter:brightness(1.6) contrast(1.08)}}
#garden.over{cursor:pointer}

/* ---------- labels ---------- */
.lab{
  position:absolute;z-index:4;transform:translate(-50%,-50%);
  padding:12px 12px 12px 16px;margin:0;background:none;border:0;border-radius:0;
  font-family:var(--serif);font-weight:500;font-size:clamp(15px,.55vw + 11px,19px);letter-spacing:.24em;
  color:var(--silver);cursor:pointer;white-space:nowrap;
  text-shadow:0 0 3px var(--bg),0 0 8px var(--bg),0 0 16px var(--bg);
  transition:color .5s,opacity .8s;
  animation:appear 2.4s ease 2.4s backwards;
}
.lab::after{
  content:"";position:absolute;left:16px;right:12px;bottom:8px;height:1px;background:var(--silver);
  transform:scaleX(0);transform-origin:left;transition:transform .7s ease;
}
.lab:hover,.lab.on{color:var(--paper)}
.lab.on::after{transform:scaleX(1)}
.lab:focus-visible{outline:1px solid var(--grey);outline-offset:-4px}
body.focus .lab:not(.on){opacity:.4}

/* ---------- name ---------- */
#sig{position:absolute;z-index:4;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;animation:appear 3s ease 1.4s backwards}
#sig h1{margin:0;font-size:clamp(16px,.6vw + 12px,21px);font-weight:500;letter-spacing:.38em;padding-left:.38em;color:var(--paper);opacity:.88}
#sig p{margin:10px 0 0;font-size:clamp(13px,.3vw + 11px,16px);font-style:italic;letter-spacing:.22em;padding-left:.22em;color:var(--grey);transition:opacity .6s}
body.focus #sig p{opacity:0}

/* ---------- the panel ---------- */
#panel{
  position:fixed;z-index:6;width:min(310px,calc(100vw - 32px));
  padding:22px 26px 18px;
  background:rgba(9,9,9,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--graphite);
  box-shadow:0 24px 70px rgba(0,0,0,.65);
  opacity:0;transform:translateY(12px);pointer-events:none;visibility:hidden;
  transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s .6s;
}
#panel.show{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s}
#panel h2{margin:0 0 12px;font-size:15px;font-weight:400;font-style:italic;letter-spacing:.26em;color:var(--grey)}
#pb{font-size:19px;line-height:1.55;font-weight:500;color:var(--paper)}
#pb p{margin:0}
#pb p+p{margin-top:10px}
#pb .cap{margin-top:16px;font-size:14px;font-style:italic;letter-spacing:.22em;color:var(--grey)}
.ar{font-family:var(--arabic);font-size:28px;line-height:1.7;display:block}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-top:1px solid var(--graphite);font-size:21px;font-style:italic;letter-spacing:.04em}
.list li:last-child{border-bottom:1px solid var(--graphite)}
#back{
  margin-top:18px;padding:0;background:none;border:0;font:inherit;font-size:15px;font-style:italic;
  letter-spacing:.16em;color:var(--grey);cursor:pointer;transition:color .3s;
}
#back:hover,#back:focus-visible{color:var(--paper);outline:none}

@media (min-width:821px){
  #panel{top:50%;translate:0 -50%}
  #panel[data-side="right"]{right:max(24px,3.5vw)}
  #panel[data-side="left"]{left:max(24px,3.5vw)}
}
@media (max-width:820px){
  #panel{left:50%;translate:-50% 0;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  .lay canvas,.lab,#sig{animation:none!important}
  .lay.on{animation:none}
  #panel,#panel.show{transition:opacity .2s,visibility 0s}
}
</style>
</head>
<body>

<main id="garden" aria-label="A pencil drawing of a tree with five branches: about, coding, games, art, writing">
  <div id="layers"></div>
  <div id="labels"></div>
  <div id="sig"><h1>Shahad Ghazwani</h1><p>touch a branch</p></div>
</main>
<div id="grain"></div>

<aside id="panel" role="region" aria-live="polite">
  <h2 id="pt"></h2>
  <div id="pb"></div>
  <button id="back" type="button">back to the tree</button>
</aside>

<script>
/* ==========================================================================
   EDIT YOUR WORDS HERE
   --------------------------------------------------------------------------
   id      short name
   start   where the branch leaves the trunk, on a 1000 x 1200 drawing
   target  roughly where the branch reaches (the leaves grow around it)
   side    which side the panel opens on: "left" or "right"
   html    what the panel says
   ========================================================================== */
const BRANCHES = [
  { id: 'about', label: 'about', start: [500, 905], target: [135, 690], side: 'right',
    html: `<p>Just a curious soul exploring different worlds through art, technology, and imagination.</p>` },

  { id: 'coding', label: 'coding', start: [500, 800], target: [190, 365], side: 'right',
    html: `<p>I enjoy building websites and applications, exploring programming, and learning about cybersecurity.</p>` },

  { id: 'games', label: 'games', start: [500, 700], target: [525, 170], side: 'right',
    html: `<ul class="list"><li>Silent Hill</li><li>Bloodborne</li><li>Red Dead Redemption</li></ul>` },

  { id: 'art', label: 'art', start: [500, 780], target: [830, 350], side: 'left',
    html: `<p>I am a visual artist and painter.</p><p>I love drawing, traditional art, and expressing ideas through visual creativity.</p>` },

  { id: 'writing', label: 'writing', start: [500, 870], target: [880, 685], side: 'left',
    html: `<p>I love writing, literature, poetry, and expressing thoughts through words.</p>
           <p class="cap">my book</p><span class="ar" lang="ar" dir="rtl">أيقونة سيريوس</span>` }
];

/* ==========================================================================
   THE DRAWING (nothing below needs editing)
   The tree is grown once as a set of pencil strokes and leaves, then drawn
   onto canvases at the exact pixel size of your screen, so the fine lines
   stay fine on every device.
   ========================================================================== */
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const adiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
  const lerp = (a, b, t) => a + (b - a) * t;
  const UP = -Math.PI / 2;

  /* ---------- growing the tree (design space 1000 x 1200) ---------- */
  const rand = mulberry(20261117);
  const trunkX = y => 500 + 11 * Math.sin((y - 650) / 85) + 4 * Math.sin(y / 31);
  const trunkW = y => 8 + 26 * Math.pow(Math.max(0, (y - 660) / 430), 1.05) + 12 * Math.pow(Math.max(0, (y - 1030) / 60), 2);

  function makeLayer(id) { return { id, strokes: [], leaves: [], bb: [1e9, 1e9, -1e9, -1e9], tip: null }; }
  function grow(L, x, y) { L.bb[0] = Math.min(L.bb[0], x); L.bb[1] = Math.min(L.bb[1], y); L.bb[2] = Math.max(L.bb[2], x); L.bb[3] = Math.max(L.bb[3], y); }
  function addStroke(L, st) { for (let i = 0; i < st.pts.length; i += 2) grow(L, st.pts[i], st.pts[i + 1]); L.strokes.push(st); }
  function addLeaf(L, x, y, ang, size, alpha) {
    grow(L, x - size, y - size); grow(L, x + size, y + size);
    L.leaves.push([x, y, ang, size, rand() < 0.45 ? 1 : 0, alpha]);
  }

  const STEP = [5, 4.5, 4, 3.4, 3];
  const PHOTO = [0, 0.012, 0.012, 0.008, 0.006];
  const WOB = [0.10, 0.20, 0.28, 0.34, 0.40];
  const START = [0.24, 0.14, 0.12, 0.10, 0];
  const SPAWN = [0.13, 0.17, 0.20, 0.24, 0];
  const LEAFP = [0, 0, 0.03, 0.08, 0.15];
  const W0 = [7, 2.8, 1.3, 0.8, 0.55];
  const W1 = [1.3, 0.9, 0.65, 0.5, 0.4];
  const LEAFSZ = [0, 0, 12, 10, 9];

  function twigGrow(L, x, y, ang, len, depth, target) {
    const step = STEP[depth], n = Math.max(3, Math.round(len / step));
    const pts = [x, y];
    let a = ang, drift = (rand() - 0.5) * 0.05, side = rand() < 0.5 ? 1 : -1;
    for (let i = 1; i <= n; i++) {
      if (target) {
        a += adiff(a, Math.atan2(target[1] - y, target[0] - x)) * 0.045;
        if (Math.hypot(target[0] - x, target[1] - y) < 14) break;
      } else {
        a += adiff(a, UP) * PHOTO[depth];
      }
      a += drift + (rand() - 0.5) * WOB[depth];
      if (rand() < 0.08) drift = (rand() - 0.5) * 0.07;
      x += Math.cos(a) * step; y += Math.sin(a) * step;
      pts.push(x, y);

      if (depth < 4 && i > n * START[depth] && i < n - 1 && rand() < SPAWN[depth]) {
        const frac = i / n;
        let ca = a + side * (0.45 + rand() * 0.6);
        if (Math.sin(ca) > 0.55) ca = a - side * (0.45 + rand() * 0.6);
        side = -side;
        const cl = Math.max(10, len * (0.48 - 0.22 * frac) * (0.8 + rand() * 0.45));
        twigGrow(L, x, y, ca, cl, depth + 1, null);
      }
      if (depth >= 2 && rand() < LEAFP[depth]) {
        const la = a + (rand() < 0.5 ? 1 : -1) * (0.45 + rand() * 0.8);
        addLeaf(L, x, y, la, LEAFSZ[depth] * (0.7 + rand() * 0.5), 0.5 + rand() * 0.4);
      }
    }
    const k = 0.85 + rand() * 0.3;
    addStroke(L, { t: depth <= 1 ? 'T' : 'L', pts, w0: W0[depth] * k, w1: W1[depth] * k, a: 0.62 + rand() * 0.25, g: 170 + rand() * 45, shade: depth === 0 });
    if (depth >= 2) {
      addLeaf(L, x, y, a + (rand() - 0.5) * 0.7, LEAFSZ[depth] * (0.95 + rand() * 0.4), 0.6 + rand() * 0.3);
      if (depth >= 3 && rand() < 0.3) addLeaf(L, x, y, a + (rand() < 0.5 ? 1 : -1) * 0.9, LEAFSZ[depth] * 0.8, 0.5 + rand() * 0.3);
    }
    return { x, y };
  }

  const LAYERS = [];

  /* trunk, bark, roots, ground */
  (function buildTrunk() {
    const L = makeLayer('trunk');
    const pts = [];
    for (let y = 1090; y >= 660; y -= 6) pts.push(trunkX(y), y);
    addStroke(L, { t: 'T', pts, w0: trunkW(1090), w1: 6, a: 0.85, g: 205, shade: true, edge: 1.0, taperFn: trunkW });

    for (let b = 0; b < 11; b++) {
      const f = (rand() * 1.7 - 0.85), y0 = 730 + rand() * 350, len = 80 + rand() * 230;
      const p = [];
      for (let y = y0; y > Math.max(680, y0 - len); y -= 6) {
        p.push(trunkX(y) + f * trunkW(y) / 2 + Math.sin(y / 17 + b) * 1.1 + (rand() - 0.5) * 0.7, y);
      }
      if (p.length > 4) addStroke(L, { t: 'L', pts: p, w0: 0.6, w1: 0.45, a: 0.3 + rand() * 0.3, g: 190 });
    }
    for (let h = 0; h < 320; h++) {
      const y = 700 + rand() * 390, side = rand() < 0.78 ? 1 : -1;
      const x = trunkX(y) + side * (0.12 + rand() * 0.38) * trunkW(y);
      const len = 7 + rand() * 12;
      addStroke(L, { t: 'L', pts: [x, y, x + len * 0.5 * side, y - len * 0.85], w0: 0.5, w1: 0.4, a: 0.16 + rand() * 0.22, g: 185 });
    }
    for (let k = 0; k < 3; k++) {
      const y = 800 + rand() * 230, x = trunkX(y) + (rand() - 0.5) * trunkW(y) * 0.5;
      for (let r = 1; r <= 3; r++) {
        const p = [];
        for (let q = 0; q <= 10; q++) { const t = q / 10 * Math.PI * 1.7 + 0.3; p.push(x + Math.cos(t) * r * 3.1, y + Math.sin(t) * r * 5.2); }
        addStroke(L, { t: 'L', pts: p, w0: 0.5, w1: 0.45, a: 0.4 - r * 0.07, g: 190 });
      }
    }
    [-1, 1].forEach(sd => {
      for (let r = 0; r < 4; r++) {
        const x0 = 500 + sd * (6 + r * 5), reach = 55 + rand() * 120, drop = 8 + rand() * 18;
        const p = [];
        for (let q = 0; q <= 14; q++) { const t = q / 14; p.push(x0 + sd * reach * t, 1080 + drop * Math.pow(t, 0.6) - 20 * (1 - t) * (1 - t) * 0 + Math.sin(t * 3 + r) * 1.5); }
        addStroke(L, { t: 'T', pts: p, w0: 5.5 - r * 0.8, w1: 0.6, a: 0.6, g: 185, shade: false });
      }
    });
    for (let g = 0; g < 190; g++) {
      const gx = 500 + (rand() + rand() + rand() - 1.5) * 260, gy = 1092 + rand() * 24;
      const len = 14 + rand() * 38;
      const fall = Math.max(0.12, 1 - Math.abs(gx - 500) / 230);
      addStroke(L, { t: 'L', pts: [gx, gy, gx + len, gy - 1.2 + rand() * 2.4], w0: 0.45, w1: 0.4, a: 0.1 + fall * 0.28, g: 175 });
    }
    for (let q = 0; q < 12; q++) {
      const sd = rand() < 0.5 ? -1 : 1;
      addLeaf(L, 500 + sd * (35 + rand() * 190), 1098 + rand() * 12, (rand() - 0.5) * 1.1 + (sd < 0 ? Math.PI : 0), 9 + rand() * 5, 0.35 + rand() * 0.3);
    }
    LAYERS.push(L);
  })();

  /* the five branches */
  BRANCHES.forEach(cfg => {
    const L = makeLayer(cfg.id);
    L.cfg = cfg;
    const sx = trunkX(cfg.start[1]), sy = cfg.start[1];
    const ta = Math.atan2(cfg.target[1] - sy, cfg.target[0] - sx);
    const ang0 = ta + adiff(ta, UP) * 0.45;
    const len = Math.hypot(cfg.target[0] - sx, cfg.target[1] - sy) * 1.15;
    L.tip = twigGrow(L, sx, sy, ang0, len, 0, cfg.target);
    LAYERS.push(L);
  });

  /* ---------- graphite grain ---------- */
  function noiseTile(size, fn) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'), im = x.createImageData(size, size), r = mulberry(99);
    for (let i = 0; i < size * size; i++) { const v = fn(r()); im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v[0]; im.data[i*4+3] = v[1]; }
    x.putImageData(im, 0, 0);
    return c;
  }
  /* knocks tiny holes in the lines, like pencil on toothy paper */
  const toothTile = noiseTile(192, v => [255, v < 0.2 ? 30 + v * 300 : 205 + v * 50]);
  /* a faint dusting across the whole page */
  document.getElementById('grain').style.backgroundImage =
    'url(' + noiseTile(220, v => [200, v < 0.35 ? v * 26 : 0]).toDataURL() + ')';

  /* ---------- pencil drawing ---------- */
  let MINLW = 0.5;

  function pline(p, lw0, lw1, alpha, gray, rnd, jit) {
    const n = p.length / 2;
    if (n < 2) return;
    let i = 0;
    while (i < n - 1) {
      const end = Math.min(n - 1, i + 4 + ((rnd() * 5) | 0));
      const t = (i + end) / 2 / (n - 1);
      c.beginPath();
      c.moveTo(p[2 * i] + (rnd() - 0.5) * jit, p[2 * i + 1] + (rnd() - 0.5) * jit);
      for (let k = i + 1; k <= end; k++) {
        const x = p[2 * k] + (rnd() - 0.5) * jit, y = p[2 * k + 1] + (rnd() - 0.5) * jit;
        if (k < end) c.quadraticCurveTo(x, y, (x + p[2 * (k + 1)]) / 2, (y + p[2 * (k + 1) + 1]) / 2);
        else c.lineTo(x, y);
      }
      c.lineWidth = Math.max(MINLW, lerp(lw0, lw1, t) * (0.8 + rnd() * 0.4));
      const g = gray | 0;
      c.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (alpha * (0.62 + rnd() * 0.38)).toFixed(3) + ')';
      c.stroke();
      i = end;
    }
  }

  function drawLine(st, rnd) {
    pline(st.pts, st.w0, st.w1, st.a, st.g || 190, rnd, 0.22);
    pline(st.pts, st.w0 * 0.8, st.w1 * 0.8, st.a * 0.5, (st.g || 190) - 15, rnd, 0.55);
  }

  function drawTaper(st, rnd) {
    const p = st.pts, n = p.length / 2, Lf = [], Rt = [];
    const wAt = i => st.taperFn ? st.taperFn(p[2 * i + 1]) : lerp(st.w0, st.w1, i / (n - 1));
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
      let tx = p[2 * b] - p[2 * a], ty = p[2 * b + 1] - p[2 * a + 1];
      const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const nx = -ty, ny = tx, w = wAt(i) / 2;
      Lf.push(p[2 * i] + nx * w, p[2 * i + 1] + ny * w);
      Rt.push(p[2 * i] - nx * w, p[2 * i + 1] - ny * w);
    }
    const lw = st.edge || (st.w0 > 5 ? 0.8 : 0.6), g = st.g || 190;
    [Lf, Rt].forEach(e => {
      pline(e, lw, lw * 0.8, st.a, g, rnd, 0.25);
      pline(e, lw * 0.8, lw * 0.6, st.a * 0.5, g - 15, rnd, 0.6);
    });
    if (st.w0 >= 6) {
      [-0.3, 0.3].forEach(f => {
        const m = [];
        for (let i = 0; i < n; i++) m.push(lerp(Lf[2*i], Rt[2*i], 0.5 + f), lerp(Lf[2*i+1], Rt[2*i+1], 0.5 + f));
        pline(m, 0.5, 0.45, st.a * 0.38, g - 10, rnd, 0.5);
      });
    }
    if (st.shade) {
      for (let i = 1; i < n - 1; i += 2) {
        const w = wAt(i);
        if (w < 3) continue;
        const ex = Rt[2 * i], ey = Rt[2 * i + 1], cx = p[2 * i], cy = p[2 * i + 1];
        const f = 0.35 + rnd() * 0.5;
        c.beginPath();
        c.moveTo(ex, ey);
        c.lineTo(lerp(ex, cx, f) - 1.2, lerp(ey, cy, f) + 2.2);
        c.lineWidth = Math.max(MINLW, 0.5);
        c.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (0.14 + rnd() * 0.2).toFixed(3) + ')';
        c.stroke();
      }
    }
  }

  function drawLeaf(lf, rnd, k) {
    const x = lf[0], y = lf[1], ang = lf[2], size = lf[3], type = lf[4], al = lf[5];
    const co = Math.cos(ang), si = Math.sin(ang), px = -si, py = co;
    const wd = size * (type ? 0.3 : 0.22);
    const tx = x + co * size, ty = y + si * size;
    const a1x = x + co * size * 0.22 + px * wd, a1y = y + si * size * 0.22 + py * wd;
    const a2x = x + co * size * 0.78 + px * wd * 0.8, a2y = y + si * size * 0.78 + py * wd * 0.8;
    const b1x = x + co * size * 0.22 - px * wd, b1y = y + si * size * 0.22 - py * wd;
    const b2x = x + co * size * 0.78 - px * wd * 0.8, b2y = y + si * size * 0.78 - py * wd * 0.8;
    const g = 175 + ((rnd() * 40) | 0);

    c.beginPath();
    c.moveTo(x, y); c.bezierCurveTo(a1x, a1y, a2x, a2y, tx, ty); c.lineTo(x + co * size * 0.5, y + si * size * 0.5); c.closePath();
    c.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (0.07 + rnd() * 0.08).toFixed(3) + ')';
    c.fill();

    c.beginPath();
    c.moveTo(x, y); c.bezierCurveTo(a1x, a1y, a2x, a2y, tx, ty);
    c.moveTo(x, y); c.bezierCurveTo(b1x, b1y, b2x, b2y, tx, ty);
    c.lineWidth = Math.max(MINLW, 0.5 * (0.8 + rnd() * 0.5));
    c.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (al * 0.8).toFixed(3) + ')';
    c.stroke();

    c.beginPath();
    c.moveTo(x - co * 2, y - si * 2); c.lineTo(x + co * size * 0.86, y + si * size * 0.86);
    c.lineWidth = Math.max(MINLW, 0.4);
    c.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (al * 0.5).toFixed(3) + ')';
    c.stroke();

    if (size * k > 9) {
      c.beginPath();
      for (let v = 0.3; v < 0.8; v += 0.22) {
        const mx = x + co * size * v, my = y + si * size * v, vl = wd * (1 - v * 0.6) * 0.9;
        c.moveTo(mx, my); c.lineTo(mx + px * vl + co * vl * 0.6, my + py * vl + si * vl * 0.6);
        c.moveTo(mx, my); c.lineTo(mx - px * vl + co * vl * 0.6, my - py * vl + si * vl * 0.6);
      }
      c.lineWidth = Math.max(MINLW, 0.35);
      c.strokeStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (al * 0.32).toFixed(3) + ')';
      c.stroke();
    }
  }

  let c = null;   /* the 2d context currently being drawn on */

  function paintLayer(L, canvas, k, seed) {
    c = canvas.getContext('2d', { willReadFrequently: true });
    const rnd = mulberry(seed);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.setTransform(k, 0, 0, k, -L.x0 * k, -L.y0 * k);
    c.lineCap = 'round'; c.lineJoin = 'round';
    MINLW = 0.6 / k;
    L.strokes.forEach(st => st.t === 'T' ? drawTaper(st, rnd) : drawLine(st, rnd));
    L.leaves.forEach(lf => drawLeaf(lf, rnd, k));
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'destination-in';
    c.fillStyle = c.createPattern(toothTile, 'repeat');
    c.fillRect(0, 0, canvas.width, canvas.height);
    c.globalCompositeOperation = 'source-over';
  }

  /* ---------- the page ---------- */
  const garden = document.getElementById('garden');
  const layersEl = document.getElementById('layers');
  const labelsEl = document.getElementById('labels');
  const sig = document.getElementById('sig');
  const panel = document.getElementById('panel');
  const pt = document.getElementById('pt');
  const pb = document.getElementById('pb');
  const backBtn = document.getElementById('back');

  LAYERS.forEach((L, i) => {
    const d = document.createElement('div');
    d.className = 'lay' + (L.id === 'trunk' ? ' trunk' : '');
    d.style.setProperty('--d', (L.id === 'trunk' ? 0 : 0.8 + i * 0.35) + 's');
    d.appendChild(document.createElement('canvas'));
    layersEl.appendChild(d);
    L.el = d; L.canvas = d.firstChild;
    L.x0 = L.bb[0] - 6; L.y0 = L.bb[1] - 6; L.x1 = L.bb[2] + 6; L.y1 = L.bb[3] + 6;
  });

  const labs = {};
  BRANCHES.forEach(cfg => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lab'; b.textContent = cfg.label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', e => { e.stopPropagation(); toggle(cfg.id); });
    labelsEl.appendChild(b);
    labs[cfg.id] = b;
  });

  let S = 1, OX = 0, OY = 0, DPR = 1;

  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    const narrow = W / H < 0.8 || W < 820;
    const vx = narrow ? 120 : 0, vw = narrow ? 760 : 1000, vy = 0, vh = 1215;
    S = Math.min(W / vw, H / vh);
    OX = (W - vw * S) / 2 - vx * S;
    OY = (H - vh * S) / 2 - vy * S;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const k = S * DPR;

    LAYERS.forEach((L, i) => {
      const cw = (L.x1 - L.x0) * S, ch = (L.y1 - L.y0) * S;
      L.el.style.left = (OX + L.x0 * S) + 'px';
      L.el.style.top = (OY + L.y0 * S) + 'px';
      L.el.style.width = cw + 'px';
      L.el.style.height = ch + 'px';
      L.canvas.width = Math.max(1, Math.round(cw * DPR));
      L.canvas.height = Math.max(1, Math.round(ch * DPR));
      paintLayer(L, L.canvas, k, 311 + i * 977);
    });

    BRANCHES.forEach(cfg => {
      const L = LAYERS.find(l => l.id === cfg.id), b = labs[cfg.id];
      let dx = L.tip.x - 500, dy = L.tip.y - 760;
      const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      let x = OX + (L.tip.x + dx * 40) * S, y = OY + (L.tip.y + dy * 40) * S;
      const hw = b.offsetWidth / 2 || 40;
      x = Math.max(hw + 6, Math.min(W - hw - 6, x));
      y = Math.max(24, Math.min(H - 24, y));
      b.style.left = x + 'px'; b.style.top = y + 'px';
    });
    sig.style.top = (OY + 1128 * S) + 'px';
  }

  /* ---------- touching a branch ---------- */
  let current = null, swapTimer = null;

  function show(cfg) {
    pt.textContent = cfg.label;
    pb.innerHTML = cfg.html;
    panel.setAttribute('data-side', cfg.side);
    panel.classList.add('show');
  }
  function open(id) {
    const cfg = BRANCHES.find(b => b.id === id);
    if (!cfg) return;
    const was = current !== null;
    current = id;
    document.body.classList.add('focus');
    LAYERS.forEach(L => { if (L.cfg) { L.el.classList.remove('on'); } });
    BRANCHES.forEach(b => { labs[b.id].classList.remove('on'); labs[b.id].setAttribute('aria-pressed', 'false'); });
    const L = LAYERS.find(l => l.id === id);
    void L.el.offsetWidth;
    L.el.classList.add('on');
    labs[id].classList.add('on'); labs[id].setAttribute('aria-pressed', 'true');
    clearTimeout(swapTimer);
    if (was && panel.classList.contains('show')) {
      panel.classList.remove('show');
      swapTimer = setTimeout(() => show(cfg), 320);
    } else show(cfg);
  }
  function close() {
    if (current === null) return;
    current = null;
    clearTimeout(swapTimer);
    document.body.classList.remove('focus');
    LAYERS.forEach(L => L.el.classList.remove('on'));
    BRANCHES.forEach(b => { labs[b.id].classList.remove('on'); labs[b.id].setAttribute('aria-pressed', 'false'); });
    panel.classList.remove('show');
  }
  function toggle(id) { current === id ? close() : open(id); }

  /* the drawn branches themselves are touchable too: look for ink near the pointer */
  function pick(cx, cy) {
    for (let i = LAYERS.length - 1; i >= 1; i--) {
      const L = LAYERS[i], r = L.canvas.getBoundingClientRect();
      if (cx < r.left || cx > r.right || cy < r.top || cy > r.bottom) continue;
      const k = L.canvas.width / r.width, rad = Math.round(7 * k);
      const px = Math.round((cx - r.left) * k), py = Math.round((cy - r.top) * k);
      const x0 = Math.max(0, px - rad), y0 = Math.max(0, py - rad);
      const w = Math.min(L.canvas.width - x0, rad * 2 + 1), h = Math.min(L.canvas.height - y0, rad * 2 + 1);
      if (w < 1 || h < 1) continue;
      const d = L.canvas.getContext('2d', { willReadFrequently: true }).getImageData(x0, y0, w, h).data;
      for (let j = 3; j < d.length; j += 4) if (d[j] > 28) return L.id;
    }
    return null;
  }
  let moveWait = false;
  garden.addEventListener('pointermove', e => {
    if (moveWait || e.pointerType === 'touch') return;
    moveWait = true;
    const x = e.clientX, y = e.clientY;
    setTimeout(() => { garden.classList.toggle('over', !!pick(x, y)); moveWait = false; }, 70);
  });
  garden.addEventListener('click', e => {
    const id = pick(e.clientX, e.clientY);
    id ? toggle(id) : close();
  });
  backBtn.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  let rz = null, lastW = innerWidth, lastH = innerHeight;
  window.addEventListener('resize', () => {
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 120) return;   /* ignore phone toolbars */
    lastW = innerWidth; lastH = innerHeight;
    clearTimeout(rz); rz = setTimeout(layout, 250);
  });

  layout();
  window.addEventListener('load', () => setTimeout(layout, 50));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
})();
</script>
</body>
</html>
